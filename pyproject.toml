[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "verdict-tiny"
version = "0.1.0"
description = "A tiny, local semantic verifier for CLI tool outcomes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Anton Balanov"}]
keywords = ["agents", "cli", "verification", "classifier", "tiny-model"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
train = ["numpy>=1.26", "scipy>=1.12", "scikit-learn>=1.4"]
dev = ["pytest>=8"]

[project.scripts]
verdict = "verdict_tiny.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verdict_tiny = ["weights/*.bin"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
